name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp,studio]"

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v

      - name: Run CLI checks
        run: |
          python -m cadharness doctor .
          python -m cadharness schemas
          python -m cadharness validate examples/project-box --variant standard
          python -m cadharness verify examples/project-box --variant standard
          python -m cadharness measure examples/nema17-mount --type hole-pattern --component mounting-plate --radius-min 1 --radius-max 3 --axis-direction 0 0 1
          python -m cadharness verify examples/nema17-mount --variant standard

      - name: Run MCP smoke test
        run: python scripts/smoke_mcp.py

  minimum-build123d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimum supported geometry stack
        run: python -m pip install -e ".[mcp,studio]" "build123d==0.13.0"
      - name: Run unit tests and MCP smoke test
        run: |
          python -m unittest discover -s tests -v
          python scripts/smoke_mcp.py

  studio-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: studio/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One-command onboarding
        run: python bootstrap.py
      - name: Check installed Studio distribution
        run: .venv/bin/python scripts/smoke_distribution.py
