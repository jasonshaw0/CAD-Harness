name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI checks
        run: |
          python -m cadharness doctor .
          python -m cadharness schemas
          python -m cadharness validate examples/project-box --variant standard
          python -m cadharness verify examples/project-box --variant standard

      - name: Run MCP smoke test
        run: python scripts/smoke_mcp.py
