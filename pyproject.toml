[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "CAD-Harness"
version = "0.10.0b1"
description = "CAD-Harness: source-backed CAD framework and MCP design workbench for build123d"
readme = "README.md"
authors = [{name = "Jason Shaw"}]
# CAD-Harness is Apache-2.0; the bundled frontend retains MIT/ISC terms.
license = "Apache-2.0 AND MIT AND ISC"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
requires-python = ">=3.11,<3.15"
dependencies = ["build123d>=0.13,<0.14"]

[project.urls]
Repository = "https://github.com/jasonshaw0/CAD-Harness"
Documentation = "https://github.com/jasonshaw0/CAD-Harness/tree/main/docs"
Issues = "https://github.com/jasonshaw0/CAD-Harness/issues"
Releases = "https://github.com/jasonshaw0/CAD-Harness/releases"

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
studio = ["starlette>=1,<2", "uvicorn>=0.41,<1"]

[project.scripts]
cad-harness = "cadharness.cli:main"
cad-harness-mcp = "cadharness.mcp_server:main"
cadharness = "cadharness.cli:main"
cadharness-mcp = "cadharness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"cadharness.workflow" = ["CONTRACTS.md", "AUTHORING.md", "prompts/*.md", "templates/*/*.py", "templates/*/*.toml", "benchmarks/prompts/*.txt"]
"cadharness.studio" = ["web/*", "web/assets/*"]
