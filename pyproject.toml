[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cadharness"
version = "0.1.0"
description = "Source-backed CAD project inspection and engineering validation for build123d"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["build123d>=0.10"]

[project.optional-dependencies]
mcp = ["mcp>=1.26,<2"]

[project.scripts]
cadharness = "cadharness.cli:main"
cadharness-mcp = "cadharness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

