[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cadharness"
version = "0.9.0"
description = "Source-backed CAD framework and MCP design workbench for build123d"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["build123d>=0.13,<0.14"]

[project.optional-dependencies]
mcp = ["mcp>=2.3,<3"]
studio = ["starlette>=1,<2", "uvicorn>=0.41,<1"]

[project.scripts]
cadharness = "cadharness.cli:main"
cadharness-mcp = "cadharness.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"cadharness.workflow" = ["CONTRACTS.md", "prompts/*.md", "templates/*/*.py", "templates/*/*.toml", "benchmarks/prompts/*.txt"]
"cadharness.studio" = ["web/*", "web/assets/*"]
